name: Dorado Software Inc
description: 'Dorado Software, Inc. is a Roseville, California infrastructure management
  software company whose Cruz and Redcell product families deliver resource management,
  orchestration, monitoring, and automation for data centers, AI infrastructure, enterprise
  campuses, and service-provider networks. The Cruz suite spans DCIM, network performance
  management, fabric and compute orchestration, compliance, and agentic-AI operations,
  discovering and controlling multi-vendor devices over SNMP, CLI, NETCONF, and REST/HTTPS.
  Dorado Software is backed by Insight Partners. This profile is maintained in the API
  Evangelist network; no public developer API, portal, or SDK surface was found.'
